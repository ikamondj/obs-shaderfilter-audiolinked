name: build obs plugin

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_NAME: obs-shaderfilter
  OBS_VERSION: '31.1.2'
  VCPKG_VERSION: e03dc9b29710050cd1018bc5674688108658d327

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            arch: x64
            preset: windows-x64
            triplet: x64-windows-static-md
          - platform: linux
            runner: ubuntu-24.04
            arch: x86_64
            preset: ubuntu
            triplet: x64-linux
          - platform: macos
            runner: macos-15
            arch: arm64
            preset: macos
            triplet: arm64-osx
          - platform: macos
            runner: macos-15
            arch: x86_64
            preset: macos
            triplet: x64-osx
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OBS
        uses: actions/checkout@v7.0.1
        with:
          repository: obsproject/obs-studio
          ref: ${{ env.OBS_VERSION }}
          submodules: recursive
          fetch-depth: 0
      - name: Checkout plugin
        uses: actions/checkout@v7.0.1
        with:
          path: plugins/obs-shaderfilter
      - name: Checkout vcpkg
        uses: actions/checkout@v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          path: vcpkg
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Test packaging
        run: python -m unittest discover -s "plugins/$PLUGIN_NAME/tests" -p 'test_package_ci.py' -v
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config extra-cmake-modules \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev libjansson-dev \
            libcurl4-openssl-dev libgl-dev libegl-dev libdrm-dev libx11-dev libx11-xcb-dev \
            libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xinput-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libpulse-dev libudev-dev libsimde-dev uuid-dev uthash-dev \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev zlib1g-dev
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Install plugin dependencies
        run: |
          ./vcpkg/vcpkg install --triplet '${{ matrix.triplet }}' \
            --x-manifest-root="$GITHUB_WORKSPACE/plugins/$PLUGIN_NAME" \
            --x-install-root="$GITHUB_WORKSPACE/plugin-deps"
      - name: Configure
        env:
          BUILD_PRESET: ${{ matrix.preset }}
          BUILD_ARCH: ${{ matrix.arch }}
          DEPENDENCY_TRIPLET: ${{ matrix.triplet }}
        run: |
          # Build the plugin and OBS libraries, without configuring unrelated plugins.
          printf 'add_subdirectory(%s)\n' "$PLUGIN_NAME" > plugins/CMakeLists.txt
          extra_args=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            extra_args+=("-DCMAKE_OSX_ARCHITECTURES=$BUILD_ARCH" '-DOBS_CODESIGN_IDENTITY=-')
          fi
          cmake --preset "$BUILD_PRESET" -B build \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_FRONTEND=OFF -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF -DENABLE_AJA=OFF -DENABLE_VLC=OFF \
            -DENABLE_WAYLAND=OFF -DENABLE_PULSEAUDIO=OFF \
            -DSHADERFILTER_FETCH_GLFW=OFF -DSHADERFILTER_BUILD_TESTS=ON \
            "-Dpffft_DIR=$GITHUB_WORKSPACE/plugin-deps/$DEPENDENCY_TRIPLET/share/pffft" \
            "-Dglfw3_DIR=$GITHUB_WORKSPACE/plugin-deps/$DEPENDENCY_TRIPLET/share/glfw3" \
            "${extra_args[@]}"
      - name: Build
        run: |
          cmake --build build --config Release --parallel 3 --target \
            obs-shaderfilter shaderfilter-spectrum-test shaderfilter-audio-energy-test shaderfilter-gamepad-test
      - name: Test audio and controller state
        run: |
          ctest --test-dir "build/plugins/$PLUGIN_NAME" -C Release --output-on-failure \
            -R '^shaderfilter-(spectrum|audio-energy|gamepad-state)$'
      - name: Package
        run: |
          python "plugins/$PLUGIN_NAME/.github/scripts/package-ci.py" \
            --build-dir "build/plugins/$PLUGIN_NAME" --config Release \
            --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --output dist
      - name: Upload portable package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: obs-shaderfilter-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler /Qp ./installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: obs-shaderfilter-windows-x64-installer-${{ github.sha }}
          path: dist/package/*.exe
          if-no-files-found: error
